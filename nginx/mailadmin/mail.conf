# PostfixAdmin
server {
    listen 443 ssl http2;
    server_name mailadmin.localtunnel.it.com;

    ssl_certificate /etc/nginx/ssl/mailserver.crt;
    ssl_certificate_key /etc/nginx/ssl/mailserver.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass http://localhost:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-SSL on;
    }
}

# Roundcube Webmail
server {
    listen 443 ssl http2;
    server_name webmail.localtunnel.it.com;

    ssl_certificate /etc/nginx/ssl/mailserver.crt;
    ssl_certificate_key /etc/nginx/ssl/mailserver.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass http://localhost:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-SSL on;
        proxy_buffering off;
    }

    # Roundcube specific paths
    location /webmail/ {
        proxy_pass http://localhost:8086/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Optional: SMTP, IMAP, POP3 proxy
stream {
    # SMTP
    server {
        listen 465 ssl;
        proxy_pass 127.0.0.1:25;
        ssl_certificate /etc/nginx/ssl/mailserver.crt;
        ssl_certificate_key /etc/nginx/ssl/mailserver.key;
    }

    # Submission
    server {
        listen 587 ssl;
        proxy_pass 127.0.0.1:587;
        ssl_certificate /etc/nginx/ssl/mailserver.crt;
        ssl_certificate_key /etc/nginx/ssl/mailserver.key;
    }

    # IMAP
    server {
        listen 993 ssl;
        proxy_pass 127.0.0.1:993;
        ssl_certificate /etc/nginx/ssl/mailserver.crt;
        ssl_certificate_key /etc/nginx/ssl/mailserver.key;
    }

    # POP3
    server {
        listen 995 ssl;
        proxy_pass 127.0.0.1:995;
        ssl_certificate /etc/nginx/ssl/mailserver.crt;
        ssl_certificate_key /etc/nginx/ssl/mailserver.key;
    }
}